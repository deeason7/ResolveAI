# Fast tests use SQLite and injected service fakes. A separate PostgreSQL job
# verifies actual migrations, relational constraints, and concurrent sessions.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  # deploy.yml calls this before it ships a tag — same gate, one definition.
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned exact: setup-uv stopped publishing floating major tags after v7,
      # so @v10 doesn't resolve. Exact pins are the safer choice for a
      # third-party action anyway — a floating tag can be moved under you.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install backend with dev tools
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint (backend + frontend + scripts, zero-warning policy)
        working-directory: backend
        run: |
          uv run ruff check . ../frontend ../scripts
          uv run ruff format --check . ../frontend ../scripts

      - name: Tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: uv run pytest tests/ -q

  docker-build:
    # Catches Dockerfile rot without booting the stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide an env file (compose validates its presence)
        run: cp .env.example .env
      - name: Build images
        run: docker compose build api frontend

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        # Matches the currently supported Compose database image.
        image: postgres:16.3-alpine
        env:
          POSTGRES_DB: resolveai_test_ci
          POSTGRES_USER: resolveai_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveai_test -d resolveai_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install backend with dev tools
        working-directory: backend
        run: uv sync --extra dev
      - name: PostgreSQL migrations and integration tests
        working-directory: backend
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+asyncpg://resolveai_test:test-only-password@127.0.0.1:5432/resolveai_test_ci
          TEST_DATABASE_ALLOW_RESET: "yes"
        run: uv run pytest tests/integration/ --run-postgres -m postgres -q
