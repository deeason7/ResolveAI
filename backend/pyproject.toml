[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai-backend"
version = "0.1.0"
description = "Intelligent Complaint Resolution Engine — backend API"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.29,<1.0",

    # ORM + migrations
    "sqlmodel>=0.0.22,<1.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",          # async PostgreSQL driver

    # Auth
    "bcrypt>=4.1,<5.0",
    "PyJWT>=2.8,<3.0",

    # Rate limiting
    "slowapi>=0.1.9,<1.0",

    # Validation / settings
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # Redis
    "redis[hiredis]>=5.0,<6.0",

    # Vector store — floor at the query_points API era, matched to the 1.13.x server
    "qdrant-client>=1.13,<2.0",

    # Embeddings
    "sentence-transformers>=3.0,<4.0",

    # Neo4j
    "neo4j>=5.20,<6.0",

    # HTTP client (for Ollama / Groq calls)
    "httpx>=0.27,<1.0",

    # Structured LLM output
    "instructor>=1.3,<2.0",
    "openai>=1.50,<2.0",            # OpenAI-compatible client (Groq, Ollama, OpenAI)
    "boto3>=1.35,<2.0",             # AWS SDK — Bedrock Converse for labeling teacher

    # Retry / backoff
    "tenacity>=8.5,<10.0",

    # Utilities
    "python-multipart>=0.0.9",     # form data / file uploads
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27",                  # AsyncClient for tests
    "ruff>=0.4,<1.0",
    "fakeredis>=2.23,<3.0",
    "aiosqlite>=0.20,<1.0",         # sqlite driver for the test conftest
]

[tool.setuptools.packages.find]
# Flat layout with two top-level dirs (app/ + alembic/). Only `app` is an
# importable package — alembic runs via its CLI + alembic.ini, and tests aren't
# installed — so scope package discovery to app*. Without this, building the
# project (uv sync / pip install -e .) fails with setuptools' "Multiple
# top-level packages discovered in a flat-layout" guard.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic"]  # auto-generated migrations + env bootstrap — not ours to style

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE"]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # Depends()/Query() in defaults — required by FastAPI
    "UP042",  # str + Enum → StrEnum migration — deferred refactor
]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars at module scope *before* importing the app (so
# pydantic-settings sees them), so its imports can't all sit at the top (E402)
# and the split block isn't sortable as one unit (I001).
"tests/conftest.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
