[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "resolveai-backend"
version = "0.1.0"
description = "Intelligent Complaint Resolution Engine — backend API"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.29,<1.0",

    # ORM + migrations
    "sqlmodel>=0.0.22,<1.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",          # async PostgreSQL driver

    # Auth
    "bcrypt>=4.1,<5.0",
    "PyJWT>=2.8,<3.0",

    # Rate limiting
    "slowapi>=0.1.9,<1.0",

    # Validation / settings
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # Redis
    "redis[hiredis]>=5.0,<6.0",

    # Vector store
    "qdrant-client>=1.9,<2.0",

    # Embeddings
    "sentence-transformers>=3.0,<4.0",

    # Neo4j
    "neo4j>=5.20,<6.0",

    # HTTP client (for Ollama / Groq calls)
    "httpx>=0.27,<1.0",

    # Structured LLM output
    "instructor>=1.3,<2.0",

    # Utilities
    "python-multipart>=0.0.9",     # form data / file uploads
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27",                  # AsyncClient for tests
    "ruff>=0.4,<1.0",
    "fakeredis>=2.23,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
