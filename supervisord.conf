; Runs the API and both stream workers in one container — the shape a
; single-container PaaS (Hugging Face Space) forces. autorestart per program
; means a worker crash is restarted on its own without bouncing the API.
;
; Logs go straight to the container's stdout/stderr (maxbytes=0 disables
; rotation) so the platform's log viewer shows them. Runtime state lives under
; /tmp because the container runs as non-root.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:api]
; %(ENV_PORT)s expands the PORT env set in the Dockerfile (7860 for HF).
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:classification-worker]
command=python -m app.workers.classification_worker
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:resolution-worker]
command=python -m app.workers.resolution_worker
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
